# Filebeat del laboratorio (TP SOR2 — E3). Se instala en /etc/filebeat/filebeat.yml (root, 600)
# con scripts/t2_ingesta_setup.sh.
#
# Reparto de transformaciones (T2):
#  - Filebeat: lee los archivos y marca cada evento con su módulo, fileset e ingest pipeline
#    ([@metadata][pipeline]). No parsea.
#  - Logstash: agrega lab.logstash_received y enruta a lab-<módulo>-AAAA.MM.DD.
#  - Elasticsearch: el ingest pipeline del módulo parsea los campos ECS y fija @timestamp desde el
#    propio log; el pipeline final "lab-ingested" agrega lab.es_ingested.
#
# Se leen solo los archivos activos (no los rotados ni los .gz) para no duplicar eventos:
# Filebeat sigue cada archivo por su inodo aunque lo renombren al rotar.

filebeat.modules:
  - module: auditd
    log:
      enabled: true
      var.paths: ["/var/log/audit/audit.log"]

  - module: apache
    access:
      enabled: true
      var.paths: ["/var/log/apache2/access.log"]
    error:
      enabled: true
      var.paths: ["/var/log/apache2/error.log"]

# Nombre del host en los eventos (host.name), igual al de la VM.
name: sor2-lab

output.logstash:
  hosts: ["127.0.0.1:5044"]

# La plantilla de índice y los pipelines se cargan aparte (t2_ingesta_setup.sh), no al arrancar.
setup.template.enabled: false
setup.ilm.enabled: false

logging.level: info
logging.to_files: true
logging.files:
  path: /var/log/filebeat
  name: filebeat
  keepfiles: 7
  permissions: 0640
