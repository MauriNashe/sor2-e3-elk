# Pipeline Logstash del laboratorio.
#
# Reparto de transformaciones (justificación pedida por la T2):
#  - Filebeat (módulos auditd y apache): lee los archivos y marca cada evento con su fileset
#    e ingest pipeline ([@metadata][pipeline]).
#  - Logstash: punto único de entrada; agrega la marca de primera recepción, enruta a índices
#    por fuente y reenvía al ingest pipeline del módulo. (T2: reconstrucción/ajustes adicionales.)
#  - Elasticsearch (ingest pipelines de los módulos): parseo de campos ECS, @timestamp desde el
#    propio log y event.ingested.
#
# Marcas de tiempo (la consigna pide distinguir generación, primera recepción e indexación):
#  @timestamp                -> generación del evento (tomado del log por el ingest pipeline)
#  lab.filebeat_read         -> lectura de la línea por Filebeat (este filtro, desde el @timestamp de Filebeat)
#  lab.logstash_received     -> primera recepción en el stack (este filtro)
#  lab.es_ingested           -> indexación en Elasticsearch (pipeline final lab-ingested)

input {
  beats {
    port => 5044
  }
}

filter {
  ruby {
    code => "event.set('[lab][logstash_received]', LogStash::Timestamp.now)"
  }
  # Al llegar a Logstash, @timestamp todavía es la hora en que Filebeat leyó la línea: el ingest pipeline
  # del módulo lo reemplaza después por la hora del propio log. Se conserva para las dos fuentes, porque el
  # módulo auditd no guarda event.created (el de apache sí).
  mutate {
    copy => { "@timestamp" => "[lab][filebeat_read]" }
  }
  # Con ecs_compatibility v8, el input beats copia la línea en [event][original]. Los ingest pipelines de
  # los módulos de Filebeat hacen ese mismo paso y fallan con "field [event.original] already exists"
  # (ver results/t2/diagnostico_parseo_incorrecto_20261119.txt). Se quita aquí y lo vuelve a poner el módulo.
  if [@metadata][pipeline] {
    mutate {
      remove_field => ["[event][original]"]
      remove_tag   => ["beats_input_codec_plain_applied"]
    }
  }
}

output {
  if [@metadata][pipeline] and [event][module] {
    elasticsearch {
      hosts           => ["http://es01:9200"]
      user            => "logstash_internal"
      password        => "${LOGSTASH_INTERNAL_PASSWORD}"
      index           => "lab-%{[event][module]}-%{+YYYY.MM.dd}"
      pipeline        => "%{[@metadata][pipeline]}"
      action          => "create"
      manage_template => false
      ilm_enabled     => false
      data_stream     => false
    }
  } else {
    # Cualquier evento sin módulo: se guarda aparte para detectar problemas de ingesta.
    elasticsearch {
      hosts           => ["http://es01:9200"]
      user            => "logstash_internal"
      password        => "${LOGSTASH_INTERNAL_PASSWORD}"
      index           => "lab-otros-%{+YYYY.MM.dd}"
      action          => "create"
      manage_template => false
      ilm_enabled     => false
      data_stream     => false
    }
  }
}
